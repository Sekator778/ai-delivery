# AI Delivery pipeline — OpenFlow flow for Windmill (conductor 4.2).
#
# Stages are inline bash rawscripts in STUB mode: they return a canned artifact
# (in ./result.json) instead of calling `claude`. The real harness call is wired in
# during the pilot (Max subscription) at the spot marked "REAL mode" in each stage.
#
# Deploy:  wmill flow push windmill/flows/ai-delivery-pipeline.flow \
#            f/ai_delivery/pipeline --workspace ai-delivery --base-url http://localhost/ --token <TOKEN>
#
# Windmill conventions learned on the first run:
#  - every bash parameter goes on its OWN line (X="$N"), or it will not parse;
#  - write the stage result to ./result.json — then it is an object and branches read
#    results.<id>.<field>; echo to stdout yields a string and field access fails.
summary: AI Delivery — delivery pipeline
description: >-
  Pipeline conductor: triage -> spec -> plan -> test_design -> implement -> gate,
  then a branch on the gate verdict (fail -> rework; pass -> manual approval -> prod).
  STUB mode checks the conductor's plumbing without any API keys.
value:
  same_worker: false
  modules:
    - id: triage
      summary: Task triage
      value:
        type: rawscript
        language: bash
        input_transforms:
          task_id: { type: javascript, expr: flow_input.task_id }
          mode: { type: javascript, expr: flow_input.mode }
        content: |
          task_id="$1"
          mode="${2:-stub}"
          >&2 echo "[triage] task=$task_id mode=$mode"
          # REAL mode: claude -p with the skills/spec skill (fast verdict)
          echo '{"stage":"triage","verdict":"ok","estimate":"S"}' > result.json
    - id: spec
      summary: Specification
      value:
        type: rawscript
        language: bash
        input_transforms:
          task_id: { type: javascript, expr: flow_input.task_id }
          mode: { type: javascript, expr: flow_input.mode }
        content: |
          task_id="$1"
          mode="${2:-stub}"
          >&2 echo "[spec] task=$task_id mode=$mode"
          # REAL mode: claude -p with the skills/spec skill (model: Opus)
          echo '{"stage":"spec","artifact":"spec.md","status":"done"}' > result.json
    - id: plan
      summary: Implementation plan
      value:
        type: rawscript
        language: bash
        input_transforms:
          task_id: { type: javascript, expr: flow_input.task_id }
          mode: { type: javascript, expr: flow_input.mode }
        content: |
          task_id="$1"
          mode="${2:-stub}"
          >&2 echo "[plan] task=$task_id mode=$mode"
          # REAL mode: claude -p with the skills/plan skill, plan mode (model: Opus)
          echo '{"stage":"plan","artifact":"plan.md","status":"done"}' > result.json
    - id: test_design
      summary: Contract tests
      value:
        type: rawscript
        language: bash
        input_transforms:
          task_id: { type: javascript, expr: flow_input.task_id }
          mode: { type: javascript, expr: flow_input.mode }
        content: |
          task_id="$1"
          mode="${2:-stub}"
          >&2 echo "[test_design] task=$task_id mode=$mode"
          # REAL mode: claude -p with the skills/test-design skill (reviewer model)
          echo '{"stage":"test_design","artifact":"src/test","status":"done"}' > result.json
    - id: implement
      summary: Implementation
      value:
        type: rawscript
        language: bash
        input_transforms:
          task_id: { type: javascript, expr: flow_input.task_id }
          mode: { type: javascript, expr: flow_input.mode }
        content: |
          task_id="$1"
          mode="${2:-stub}"
          >&2 echo "[implement] task=$task_id mode=$mode"
          # REAL mode: claude -p with the skills/implement skill (Chinese coding model)
          echo '{"stage":"implement","artifact":"src/main","status":"done"}' > result.json
    - id: gate
      summary: Quality gate
      value:
        type: rawscript
        language: bash
        input_transforms:
          task_id: { type: javascript, expr: flow_input.task_id }
          gate_outcome: { type: javascript, expr: flow_input.gate_outcome }
        content: |
          task_id="$1"
          gate_outcome="${2:-pass}"
          >&2 echo "[gate] task=$task_id verdict=$gate_outcome"
          # REAL mode: mvn verify (tests+JaCoCo+SpotBugs+Checkstyle) + cross-model review
          echo "{\"stage\":\"gate\",\"verdict\":\"$gate_outcome\"}" > result.json
    - id: gate_branch
      summary: Branch on the gate verdict
      value:
        type: branchone
        branches:
          - summary: gate fail — rework
            expr: 'results.gate.verdict != "pass"'
            modules:
              - id: rework
                summary: Rework
                value:
                  type: rawscript
                  language: bash
                  input_transforms: {}
                  content: |
                    >&2 echo "[rework] gate not passed — back to test_design (pilot: mark only)"
                    echo '{"stage":"rework","status":"needs_rework"}' > result.json
        default:
          - id: approval
            summary: Manual approval before prod
            suspend:
              required_events: 1
              timeout: 86400
            value:
              type: rawscript
              language: bash
              input_transforms: {}
              content: |
                >&2 echo "[approval] waiting for manual approval (Windmill suspend)"
                echo '{"stage":"approval","status":"approved"}' > result.json
          - id: prod
            summary: Deploy to prod
            value:
              type: rawscript
              language: bash
              input_transforms: {}
              content: |
                >&2 echo "[prod] deploy to prod (stub)"
                echo '{"stage":"prod","status":"deployed"}' > result.json
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    task_id:
      type: string
      description: Task ID
    task_text:
      type: string
      description: Business task text
    mode:
      type: string
      description: stub | real
      default: stub
    gate_outcome:
      type: string
      description: 'STUB: gate verdict for exercising the branches (pass|fail)'
      default: pass
  required:
    - task_id
